<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Fancy Space</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #3b82f6;
            --secondary-glow: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background glow vectors */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        body::before {
            background: var(--primary-glow);
            top: 15%;
            left: 20%;
        }

        body::after {
            background: var(--secondary-glow);
            bottom: 15%;
            right: 20%;
            animation-delay: -4s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        /* Glassmorphism Container */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 440px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Elegant interactive link list */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .fancy-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fancy-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .fancy-link .icon {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .fancy-link .arrow {
            transform: translateX(0);
            transition: transform 0.2s ease;
            opacity: 0.6;
        }

        .fancy-link:hover .arrow {
            transform: translateX(4px);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="avatar">✨</div>
        <h1>Index of Workspace</h1>
        <p>Welcome! This dashboard gathers live entry routes to deployment builds and project resources.</p>
        
        <div class="links-container">
            <a href="./app/" class="fancy-link">
                <span><span class="icon">🚀</span> Main Application</span>
                <span class="arrow">→</span>
            </a>
            <a href="./docs/" class="fancy-link">
                <span><span class="icon">📝</span> Documentation</span>
                <span class="arrow">→</span>
            </a>
            <a href="./assets/" class="fancy-link">
                <span><span class="icon">📦</span> Static Assets</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://github.com" target="_blank" class="fancy-link">
                <span><span class="icon">💻</span> Source Repository</span>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

</body>
</html>
